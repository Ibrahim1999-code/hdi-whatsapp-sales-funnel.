<style>
  :root{
    --ink:#0B1F3B;
    --steel:#2F6DAA;
    --gold:#F5B800;
    --grey:#E6EAF0;
    --white:#FFFFFF;
    --near-black:#0A0D12;
    --muted:#9FB0CC;
    --line:rgba(230,234,240,0.16);
    --line-strong:rgba(245,184,0,0.5);
    --panel:rgba(47,109,170,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(135deg, rgba(47,109,170,0.05) 0px, rgba(47,109,170,0.05) 1px, transparent 1px, transparent 34px),
      var(--near-black);
    color:var(--white);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.01em;
    margin:0 0 10px 0;
    color:var(--white);
  }
  p{margin:0 0 12px 0; color:var(--muted);}
  a{color:var(--gold);}
  .mono{font-family:'JetBrains Mono',monospace;}

  .shell{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:88px; background:var(--ink); box-shadow:0 0 60px rgba(0,0,0,0.5);}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line);
    background:var(--near-black);

  .mark{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:var(--white); display:flex; align-items:center; gap:7px;}
  .mark .dot{width:7px; height:7px; background:var(--gold);}
  .mark span{color:var(--gold);}
  .step-tag{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:0.04em;}
  .step-tag b{color:var(--gold);}

  .segbar{display:flex; gap:3px; padding:0; height:3px; background:var(--near-black);}
  .seg{flex:1; height:3px; background:rgba(255,255,255,0.08);}
  .seg.done{background:var(--gold);}

  .pad{padding:24px 20px 20px 20px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); margin-bottom:10px;
    display:inline-block; border:1px solid var(--line-strong); padding:4px 9px;
  }

  .bottom-bar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);

    border-top:1px solid var(--gold); padding:14px 20px;
    z-index:40;
  }
  .btn{
    width:100%; border:none; border-radius:0;
    font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:16px;
    letter-spacing:0.03em; text-transform:uppercase;
    padding:16px; cursor:pointer; text-align:center;

  .btn-gold{background:var(--gold); color:var(--near-black);}
  .btn-steel{background:var(--steel); color:var(--white);}
  .btn-ghost{background:transparent; color:var(--white); border:1px solid var(--line);}
  .btn-text{background:none; border:none; color:var(--muted); font-size:13px; text-decoration:underline; cursor:pointer; padding:8px; font-family:'Inter',sans-serif; text-transform:none;}

  .panel-num{font-family:'JetBrains Mono',monospace; color:var(--gold); font-weight:700; font-size:12px;}

  .field{margin-bottom:16px;}

  .field-error{color:#FF8A80; font-size:13px; margin:6px 0 4px 0; min-height:16px;}

  .or-div{display:flex; align-items:center; gap:10px; margin:12px 0; color:var(--muted); font-size:11px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.08em;}

  .center{padding:60px 24px 90px 24px; text-align:center;}
  .center .badge{width:58px; height:58px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 18px auto; color:var(--gold);}
  .center .badge.closed{border-color:var(--line); color:var(--muted);}
  .center p{max-width:380px; margin-left:auto; margin-right:auto;}
  .fine{font-size:12px; color:var(--muted); margin-top:30px; font-family:'JetBrains Mono',monospace; letter-spacing:0.04em;}

  .video-slot{width:100%; max-width:320px; aspect-ratio:9/16; margin:16px auto; border:1px solid var(--line); border-top:2px solid var(--gold); display:block; overflow:hidden; object-fit:cover; background:#000;}

  .phone-row{display:flex; gap:8px;}
  .phone-row select{flex:0 0 92px;}

  .notice-banner{background:rgba(245,184,0,0.12); border:1px solid var(--gold); color:var(--gold); font-size:12.5px; padding:9px 20px; text-align:center; font-family:'JetBrains Mono',monospace;}

  .balloon-field{position:relative; height:70px; margin-bottom:8px; overflow:hidden;}
  .balloon{position:absolute; bottom:-40px; font-size:26px; animation:balloonPop 3.2s ease-in infinite;}
  .balloon:nth-child(1){left:14%; animation-delay:0s;}
  .balloon:nth-child(2){left:34%; animation-delay:0.5s; font-size:22px;}
  .balloon:nth-child(3){left:50%; animation-delay:0.2s; font-size:30px;}
  .balloon:nth-child(4){left:66%; animation-delay:0.9s; font-size:22px;}
  .balloon:nth-child(5){left:84%; animation-delay:0.35s;}
  @keyframes balloonPop{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    12%{ opacity:1; }
    75%{ opacity:1; }
    100%{ transform:translateY(-160px) rotate(8deg); opacity:0; }
  }
</style>

<script>

}

  return {

    details: { fullName:'', email:'', whatsapp:'', whatsappCode:'+234', country:'', businessName:'', businessType:'' },

    payment: { method:'', reference:'', status:'unpaid' },

    hdiId: '',
    selectedTierKey: ''
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const saved = JSON.parse(raw);
    return Object.assign(defaultState(), saved, {
      details: Object.assign(defaultState().details, saved.details || {}),
      qual: Object.assign(defaultState().qual, saved.qual || {}),
      payment: Object.assign(defaultState().payment, saved.payment || {})
    });
  }catch(e){ storageOK = false; return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageOK = true; }
  catch(e){ storageOK = false; }
  updateStorageWarning();
}
function updateStorageWarning(){
  const w = document.getElementById('storageWarn');
  if(w) w.style.display = storageOK ? 'none' : 'block';
}
let state = loadState();

function generateHdiId(){
  return 'HDI ' + Math.floor(10000 + Math.random() * 90000);
}
if(!state.hdiId){ state.hdiId = generateHdiId(); saveState(); sendToSheet('funnel_started'); }

(function checkVerifiedLink(){

/* Scale any base (₦5,000-tier) displayed amount by a tier multiplier, keeping its currency format intact */
function scaleAmount(amount, mult){
  const m = amount.match(/^([^\d]*)([\d,]+)(.*)$/);
  if(!m) return amount;
  const prefix = m[1], suffix = m[3];
  let num = parseInt(m[2].replace(/,/g,''), 10) * mult;
  if(num >= 1000) num = Math.round(num / 10) * 10;
  return prefix + num.toLocaleString('en-US') + suffix;
}
function priceDisplayForTier(mult){
  return PRICE_DISPLAY.map(p => ({ country: p.country, amount: scaleAmount(p.amount, mult), currency: p.currency }));
}
function amountForCountry(country, mult){
  const row = PRICE_DISPLAY.find(p => p.country === country);
  return row ? scaleAmount(row.amount, mult) : scaleAmount('$6', mult);
}

function priceFor(country){
  const t = TIERS.find(x => x.key === state.selectedTierKey) || TIERS[0];
  return amountForCountry(country, t.mult);
}
function selectedTier(){

}

/* ============ RENDER HELPERS ============ */
const app = document.getElementById('app');
function mark(){ return `<div class="topbar"><div class="mark"><span class="dot"></span>HABIB DIGITAL <span>INSTITUTE</span></div></div>`; }
function segbar(step, total){
  if(!step) return '';
  let segs = '';
  for(let i=1;i<=total;i++){ segs += `<div class="seg ${i<=step?'done':''}"></div>`; }
  return `<div class="segbar">${segs}</div>`;
}
function copyHdiId(){
  const btn = document.getElementById('copyBtn'); const text = state.hdiId;
  function showCopied(){ if(!btn) return; const o=btn.textContent; btn.textContent='Copied'; btn.classList.add('copied'); setTimeout(function(){btn.textContent=o; btn.classList.remove('copied');},1800); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(showCopied).catch(function(){fallbackCopy(text,showCopied);}); }
  else { fallbackCopy(text, showCopied); }
}
function fallbackCopy(text, cb){
  try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); if(cb) cb(); }catch(e){}
}

      <p style="font-size:13px;">Include this ID in your transfer narration or description, it's how we match your payment to your application. Keep it, you'll need it again on the next step.</p>
      ${paymentBlockFor(state.details.country)}
      <p style="font-size:13px;">Once you've paid, continue to confirm it. We'll manually verify your payment and open your access.</p>
    </div>
    <div class="bottom-bar"><button class="btn btn-gold" onclick="go('confirmation')">Confirm My Enrollment →</button></div>
  `;
}

/* ============ PAGE: CONFIRMATION ============ */
function pageConfirmation(){
  const d = state.details;
  return `
    ${mark()}
    <div class="pad">
      <h2 style="font-size:22px;">Confirm Your Payment</h2>
      <div class="field"><label>Full Name</label><input id="c_name" value="${d.fullName}"></div>
      <div class="field"><label>Email Address</label><input id="c_email" type="email" value="${d.email}"></div>
      <div class="field"><label>Payment Method</label>
        <select id="c_method">
          <option value="Bank Transfer">Bank Transfer</option>
          <option value="Mobile Money">Mobile Money</option>
          <option value="Agent">Agent</option>
          <option value="Nestuge">Nestuge</option>
        </select>
      </div>
      <div class="field"><label>HDI ID (your payment reference)</label>
        <input id="c_ref" value="${state.hdiId}" disabled>
        <div class="hint">This is the code you added to your transfer. If you forgot to include it, mention "${state.hdiId}" when you message us on WhatsApp.</div>
      </div>
      <div class="field"><label>Country</label><input value="${d.country}" disabled>
        <div class="hint">Tapping below opens WhatsApp with your HDI ID and name already filled in. Attach your receipt screenshot to that message before sending it.</div>
      </div>
      <div id="c_error" class="field-error"></div>
    </div>
    <div class="bottom-bar"><button class="btn btn-gold" onclick="submitConfirmation()">Continue to WhatsApp →</button></div>
  `;
}
function submitConfirmation(){
  const name = document.getElementById('c_name').value.trim();
  const email = document.getElementById('c_email').value.trim();
  const ref = document.getElementById('c_ref').value.trim();
  const method = document.getElementById('c_method').value;
  const errEl = document.getElementById('c_error');
  if(!name || !email){ if(errEl) errEl.textContent = 'Please fill in your name and email so we can find your application.'; return; }
  state.details.fullName = name; state.details.email = email;
  state.payment.method = method; state.payment.reference = ref; state.payment.status = 'pending';
  saveState(); sendToSheet('payment_submitted');
  if(typeof fbq==='function'){ fbq('track','Purchase', {value: selectedTier().price, currency: 'NGN'}); }
  const waText = encodeURIComponent('Hello HDI, I have completed my payment for ' + selectedTier().name + ' and I am ready for access. HDI ID: ' + state.hdiId + '. Name: ' + name + '. Please confirm my access.\n(Attaching my payment receipt to this message.)');
  window.open('https://wa.me/' + REVIEW_WHATSAPP_NUMBER + '?text=' + waText, '_blank');
  go('pending');
}

/* ============ PAGE: PENDING / ACCESS / DISQUALIFIED ============ */
function pagePending(){
  return `${mark()}<div class="center">
    <div class="balloon-field">
      <span class="balloon">🎈</span><span class="balloon">🎈</span><span class="balloon">🎈</span><span class="balloon">🎈</span><span class="balloon">🎈</span>
    </div>
    <div class="badge">🎉</div>
    <h2 style="font-size:22px;">Congratulations, You're In!</h2>
    <p>Thanks, ${state.details.fullName ? state.details.fullName.split(' ')[0] : 'there'}. Your place is secured under <strong style="color:var(--white);">${state.hdiId}</strong>.</p>
    <p>One last step: send your payment screenshot on WhatsApp so we can verify it and open your access, this protects your spot from being shared by people who haven't paid. You'll hear back shortly after.</p>
    <div class="fine">HABIB DIGITAL INSTITUTE</div>
  </div>`;
}
function pageAccess(){
  const firstName = state.details.fullName ? state.details.fullName.split(' ')[0] : 'there';
  return `${mark()}<div class="center">
    <div class="badge">✓</div>
    <h1 style="font-size:26px;">Confirmed, ${firstName}.</h1>
    <p>Your access is ready.</p>
    <div class="panel" style="text-align:left;"><p style="margin:0 0 6px 0; color:var(--white);">✓ Payment confirmed</p><p style="margin:0; color:var(--white);">✓ HDI access ready</p></div>
    <a class="btn btn-gold" style="display:block; text-decoration:none;" href="https://chat.whatsapp.com/L6jGvRd93AZ8ffycYY7nQr?s=cl&p=a&mlu=4&ilr=4" target="_blank">Join the HDI WhatsApp Group</a>
    <div class="fine">HABIB DIGITAL INSTITUTE</div>
  </div>`;
}
function pageDisqualified(){
  return `${mark()}<div class="center">
    <div class="badge closed">✕</div>
    <h2 style="font-size:22px;">This Opportunity Has Closed for You</h2>
    <p>Based on your answers, this isn't the right time for you to join HDI, so this application ends here.</p>
    <p>This exact opportunity, this price, this cohort, won't come back around for you again. Doors like this one don't stay open, and we can't hold a place for someone who isn't ready to move right now.</p>
    <p>We understand, and we wish you well. Before you go, here's something valuable for your business either way.</p>
    <a class="btn btn-ghost" style="display:block; text-decoration:none; margin-top:6px;" href="https://drive.google.com/drive/folders/12VzbciJuaws2PkoEfkNAiQ9tcbkS63rV" target="_blank">Access Free Resource</a>
    <p style="font-size:12.5px; margin-top:10px;">Why People View Your Business But Don't Buy</p>
    <div class="fine">HABIB DIGITAL INSTITUTE</div>
  </div>`;
}

/* ============ ROUTER ============ */
function render(){
  try{
    if(state.page === 'access' && state.payment.status !== 'confirmed'){
      state.page = state.payment.status === 'pending' ? 'pending' : 'payment'; saveState();
    }
    let html = '';
    switch(state.page){
      case 'opening': html = pageOpening(); break;
      case 'learn': html = pageLearn(); break;
      case 'price': html = pagePrice(); break;
      case 'tierDetail': html = pageTierDetail(); break;
      case 'details': html = pageDetails(); break;
      case 'application': html = pageApplication(); break;
      case 'faq': html = pageFaq(); break;
      case 'payment': html = pagePayment(); break;
      case 'confirmation': html = pageConfirmation(); break;
      case 'pending': html = pagePending(); break;
      case 'access': html = pageAccess(); break;
      case 'disqualified': html = pageDisqualified(); break;
      default: html = pageOpening();
    }
    app.innerHTML = html;
  }catch(err){
    app.innerHTML = `${mark()}<div class="center"><h2>Something went wrong loading this page</h2><p>Please refresh, or tap below to start over.</p><button class="btn btn-gold" onclick="restartFunnel()">Start Over</button></div>`;
    try{ console.error('HDI application render error:', err); }catch(e){}
  }
}
function restartFunnel(){ state = defaultState(); saveState(); render(); }
window.addEventListener('error', function(){
  if(!app.innerHTML.trim()){
    app.innerHTML = `${mark()}<div class="center"><h2>This page needs a refresh</h2><button class="btn btn-gold" onclick="location.reload()">Reload</button></div>`;
  }
});
updateStorageWarning();
render();
</script>
</body>
</html>
